[project]
name = "localify"
version = "1.0.0"
description = "Download YouTube audio with metadata for Spotify Local Files"
# This tells pip to automatically install these if the user doesn't have them
dependencies = [
    "yt-dlp",
    "mutagen"
]

# This is the magic part that creates your terminal command
[project.scripts]
lcfy = "localify:main"

# Standard boilerplate telling Python how to build the package
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
