[project]
name = "yt-localify"
version = "0.1.0"
description = "Wrapper for yt-dlp that is specifically for downloading song audio from YouTube for Spotify."
authors = [{name = "Myles Swamy", email = "myles.swamy5@gmail.com"}]
urls = {Homepage = "https://github.com/5elym/Localify"}
# This tells pip to automatically install these if the user doesn't have them
dependencies = [
    "yt-dlp",
    "mutagen"
]

[project.scripts]
lcfy = "localify:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
